spring:
  profiles:
    active: dev            # 本地私有配置见 application-dev.yml（已被 .gitignore 忽略）

  datasource:
    url: jdbc:mysql://localhost:3306/forum?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}      # 换成你 RabbitMQ 的地址
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  ai:
    openai:
      api-key: ${ZHIPU_API_KEY:}          # 在 application-dev.yml 或环境变量中提供
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4-flash

  mail:
    host: smtp.qq.com
    port: 587
    username: ${MAIL_USERNAME:}           # 你的 QQ 邮箱
    password: ${MAIL_PASSWORD:}           # 邮箱 SMTP 授权码
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  upload:
    dir: ${UPLOAD_DIR:D:/forum/backend/uploads/}   # 本地实际路径，结尾带斜杠

qweather:
  host: ${QWEATHER_HOST:}
  kid: ${QWEATHER_KID:}
  sub: ${QWEATHER_SUB:}
  iss: ${QWEATHER_ISS:}
  private-key-path: ${QWEATHER_KEY_PATH:}          # Ed25519 私钥文件路径，切勿提交

mybatis-plus:
  global-config:
    db-config:
      id-type: auto
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 签名密钥，至少 32 字节（HS256 要求 256 位）
# 生产环境务必用环境变量 JWT_SECRET 覆盖，不要沿用仓库里的默认值
jwt:
  secret: ${JWT_SECRET:local-dev-only-jwt-secret-key-change-me-32b}
